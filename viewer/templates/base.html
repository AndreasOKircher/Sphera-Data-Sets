<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Sphera LCA Viewer{% endblock %}</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #f5f5f5; color: #222; }
    a { color: #0057b8; text-decoration: none; }
    a:hover { text-decoration: underline; }
    .nav { background: #1a1a2e; color: #fff; padding: 12px 24px; display: flex; align-items: center; gap: 16px; }
    .nav a { color: #a8dadc; font-weight: bold; }
    .container { max-width: 1100px; margin: 0 auto; padding: 24px; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
    .badge-type { background: #dbeafe; color: #1d4ed8; }
    .badge-dqi-good { background: #d1fae5; color: #065f46; }
    .badge-dqi-very-good { background: #a7f3d0; color: #064e3b; }
    .badge-dqi-other { background: #fef3c7; color: #92400e; }
    .badge-supply-good { background: #d1fae5; color: #065f46; }
    .badge-supply-other { background: #e5e7eb; color: #6b7280; }
    .null { color: #999; font-style: italic; }
  </style>
</head>
<body>
  <nav class="nav">
    <a href="/">Sphera LCA Viewer</a>
    <span style="font-size:12px; color:#7a8fa6;">{{ output_dir }}</span>
    {% if llm_configured %}
      <span style="font-size:12px; color:#a8dadc;" title="Change via LLM_PROVIDER / LLM_MODEL in .env">
        ⚡ {{ llm_provider }} · {{ llm_model }}
      </span>
    {% else %}
      <span style="font-size:12px; color:#f87171;" title="Set LLM_PROVIDER and API key in .env to enable LLM queries">
        ⚠ LLM not configured
      </span>
    {% endif %}
    <form method="post" action="/shutdown" style="margin-left:auto;"
          onsubmit="return confirm('Stop the server?');">
      <button type="submit"
        style="padding:3px 10px; font-size:12px; border:1px solid rgba(255,255,255,.2);
               border-radius:4px; background:rgba(255,255,255,.07); color:#9ca894;
               cursor:pointer;">Stop server</button>
    </form>
  </nav>
  <div class="container">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
